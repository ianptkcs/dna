name: Bug report
description: Reportar um comportamento incorreto no DNA
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: O que aconteceu
      description: Descreva o bug e o que você esperava que acontecesse em vez disso.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Rodei '...'
        2. Com a flag/opção '...'
        3. Veja o erro
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ambiente
      placeholder: hardware real ou VM (QEMU/etc.), método de instalação do Arch, versões relevantes de pacotes (kernel, gum, niri, ...)
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Cole aqui o log relevante (ex. `~/.cache/dna-install/install.log`) ou screenshots. Nunca cole segredos, tokens ou dados pessoais.
    validations:
      required: false
